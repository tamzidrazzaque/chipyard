# HOST-ONLY TEMPLATE -- DO NOT RUN infrasetup/boot/runworkload from this file.
# A coordinated one-entry FPGA database is mandatory because FireSim maps its
# sole logical slot (0) to database entry 0.  Never point this at the shared
# eight-entry /opt/firesim-db.json.

run_farm:
    base_recipe: run-farm-recipes/externally_provisioned.yaml
    recipe_arg_overrides:
        default_platform: CorigineXB10InstanceDeployManager
        default_simulation_dir: /scratch/trazzaque/firesim-runs/xb10-controlled-pair
        default_fpga_db: "__REPLACE_WITH_COORDINATED_ONE_ENTRY_FPGA_DB_JSON__"
        run_farm_hosts_to_use:
            - localhost: xb10_controlled_single_slot
        run_farm_host_specs:
            - xb10_controlled_single_slot:
                num_fpgas: 1
                num_metasims: 0
                use_for_switch_only: false

metasimulation:
    metasimulation_enabled: false
    metasimulation_host_simulator: verilator
    metasimulation_only_plusargs: ""
    metasimulation_only_vcs_plusargs: ""

target_config:
    topology: no_net_config
    no_net_num_nodes: 1
    link_latency: 6405
    switching_latency: 10
    net_bandwidth: 200
    # Sample all five FASED models coarsely; each driver also writes a final row.
    profile_interval: 10000000
    default_hw_config: xb10_two_sm_hbm2_frfcfs_20mhz_timing
    plusarg_passthrough: ""

tracing:
    enable: no
    output_format: 0
    selector: 1
    start: 0
    end: -1

autocounter:
    read_rate: 0

workload:
    # Audit sentinel only.  Select exactly one of the nine campaign workload
    # JSONs for each invocation; a nine-job JSON would silently use only job 0
    # with this one-slot topology.
    workload_name: ../../../../investigation/workloads/xb10-two-sm-hashed-timed-stream-copy.json
    terminate_on_completion: no
    suffix_tag: xb10-hbm-template

host_debug:
    zero_out_dram: no
    disable_synth_asserts: no

synth_print:
    start: 0
    end: -1
    cycle_prefix: yes
