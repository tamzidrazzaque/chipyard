# Diagnostic HBM2-2000 profile at a 1 GHz FASED target tick.
# Identical to hbm2-FRFCFS-2000-OP-REFab.source.conf except enabling the
# JESD235 per-bank refresh policy. This is a real model mode, not a relaxed
# refresh interval, and still requires independent command-trace validation.
+mm_relaxFunctionalModel=0
+mm_openPagePolicy=1
+mm_perBankRefresh=1
+mm_backendLatency=2
+mm_schedulerWindowSize=8
+mm_transactionQueueDepth=8
+mm_hbmTimings_tCAS=14
+mm_hbmTimings_tCWD=5
+mm_hbmTimings_tBL=2
+mm_hbmTimings_tCMD=1
+mm_hbmTimings_tCCDS=2
+mm_hbmTimings_tCCDL=4
+mm_hbmTimings_tRRDS=4
+mm_hbmTimings_tRRDL=4
+mm_hbmTimings_tFAW=15
+mm_hbmTimings_tWTRS=6
+mm_hbmTimings_tWTRL=8
+mm_hbmTimings_tRCDRD=14
+mm_hbmTimings_tRCDWR=12
+mm_hbmTimings_tRP=14
+mm_hbmTimings_tRAS=34
+mm_hbmTimings_tRC=48
+mm_hbmTimings_tRTP=5
+mm_hbmTimings_tWR=16
+mm_hbmTimings_tREFI=3900
+mm_hbmTimings_tRFC=350
+mm_hbmTimings_tRFCSB=160
+mm_hbmTimings_tRREFD=8
+mm_rowAddr_offset=15
+mm_rowAddr_mask=524287
+mm_pcAddr_offset=14
+mm_pcAddr_mask=1
+mm_bankAddr_offset=10
+mm_bankAddr_mask=15
