# Controlled Corigine XB10 comparison. Keep every field identical between the
# two recipes except PLATFORM_CONFIG.
xb10_two_sm_hbm2_frfcfs_20mhz_timing:
    PLATFORM: corigine_xb10
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: /scratch/trazzaque/chipyard/generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: FireSimE4M3MxGemminiTwoClusterHBMRadianceConfig
    PLATFORM_CONFIG: HBM2FRFCFS16GBDualPC_BaseCorigineXB10Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 20
        build_strategy: TIMING
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/corigine_xb10.yaml
    bit_builder_arg_overrides:
        vivado_settings: /ecad/tools/xilinx/2025.1/Vivado/settings64.sh

xb10_two_sm_ddr3_frfcfs_20mhz_timing:
    PLATFORM: corigine_xb10
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: /scratch/trazzaque/chipyard/generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: FireSimE4M3MxGemminiTwoClusterHBMRadianceConfig
    PLATFORM_CONFIG: FRFCFS8GBQuadRank_BaseCorigineXB10Config
    deploy_quintuplet: null
