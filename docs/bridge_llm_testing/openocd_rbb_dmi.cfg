# OpenOCD config for FireSim rbb_dmi_bridge demo
# Connects via remote_bitbang TCP to the FireSim simulator's JTAG-to-DMI bridge.
#
# Usage:
#   1. Launch the simulator (see README.md for the exact command)
#   2. In a separate terminal: openocd -f openocd_rbb_dmi.cfg
#   3. Optionally attach GDB: riscv64-unknown-elf-gdb <elf> -ex "target extended-remote localhost:3333"

set _CHIPNAME riscv

adapter driver remote_bitbang
adapter speed 10000
remote_bitbang host localhost
remote_bitbang port 23000

# JTAG TAP: 5-bit IR, IDCODE as returned by our jtag_dtm_translator_t (0x10000001)
jtag newtap $_CHIPNAME cpu \
    -irlen 5 \
    -expected-id 0x10000001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

$_TARGETNAME configure -event examine-end {
    echo "Target examined successfully"
}

init
echo "OpenOCD initialized, halting target..."
halt
echo "Target halted."
reg pc
reg a0
echo "Demo complete. OpenOCD is running."
echo "Try: resume, step, reg, mdd 0x80000000"
